<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Custom Platformer</title>
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        /* Touch controls container */
        .touch-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 15px;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            pointer-events: none;
            z-index: 1000;
        }
        /* Control groups */
        .control-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .control-group-left {
            align-items: flex-end;
        }
        .control-group-right {
            align-items: flex-end;
        }
        /* Touch buttons */
        .touch-controls button {
            width: 70px;
            height: 70px;
            font-size: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.1s;
        }
        .touch-controls button:active,
        .touch-controls button.pressed {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.5);
        }
        /* Jump button larger */
        #jumpBtn {
            width: 80px;
            height: 80px;
            font-size: 36px;
        }
        /* Fire button with distinct color */
        #fireBtn {
            background: rgba(255, 100, 50, 0.4);
        }
        #fireBtn:active,
        #fireBtn.pressed {
            background: rgba(255, 100, 50, 0.6);
        }
        /* Landscape optimizations */
        @media (orientation: landscape) and (max-height: 500px) {
            .touch-controls button {
                width: 55px;
                height: 55px;
                font-size: 26px;
            }
            #jumpBtn {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }
            .touch-controls {
                padding: 10px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="touchControls" class="touch-controls">
        <div class="control-group control-group-left">
            <button id="leftBtn">&#x25C0;</button>
            <button id="rightBtn">&#x25B6;</button>
        </div>
        <div class="control-group control-group-right">
            <button id="fireBtn">&#x1F525;</button>
            <button id="jumpBtn">&#x2B06;</button>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        // Detect touch capability
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        if (isTouchDevice) {
            document.getElementById('touchControls').style.display = 'flex';

            // Prevent default touch behaviors that interfere with game
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            // Prevent pull-to-refresh on mobile
            document.body.addEventListener('touchmove', function(e) {
                if (e.target === document.body || e.target.tagName === 'CANVAS') {
                    e.preventDefault();
                }
            }, { passive: false });
        }
    </script>
</body>
</html>
